# Render Blueprint Deployment Configuration
# Deploys:
# 1. PostgreSQL Database (enterprise_db)
# 2. Storefront Web Service (ARTISAN LUXE E-Commerce & Privacy Portal)
# 3. In-VPC Zone Agent Background Worker (Local Discovery & DSR Erasure Executor)

databases:
  - name: enterprise-postgres
    databaseName: enterprise_db
    user: app_user
    plan: free
    region: singapore # Closest to India region on Render

services:
  # ---------------------------------------------------------------------------
  # 1. E-Commerce Storefront & Customer Privacy Center (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: sim-enterprise-storefront
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:ecom
    startCommand: npm --workspace=sim-enterprise/ecom-app run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: storefront
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-postgres
          property: connectionString
      - key: DB_TYPE
        value: POSTGRES
      - key: CONTROL_PLANE_URL
        value: https://dpdp-control-plane.onrender.com # Point to your deployed SaaS Control Plane
      - key: ORGANIZATION_SLUG
        value: artisan-luxe-enterprise
      - key: SESSION_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. In-VPC Zone Agent Daemon (Background Worker)
  # ---------------------------------------------------------------------------
  - type: worker
    name: sim-enterprise-zone-agent
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:ecom
    startCommand: npm --workspace=sim-enterprise/ecom-app run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-postgres
          property: connectionString
      - key: DB_TYPE
        value: POSTGRES
      - key: CONTROL_PLANE_URL
        value: https://dpdp-control-plane.onrender.com
      - key: ORGANIZATION_SLUG
        value: artisan-luxe-enterprise
      - key: AGENT_ID
        value: agent-render-sg-01
      - key: AGENT_NAME
        value: Render-InVPC-Zone-Agent
      - key: HEARTBEAT_INTERVAL_MS
        value: "5000"
      - key: DDL_CHECK_INTERVAL_MS
        value: "15000"
