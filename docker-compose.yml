services:
  ecom-storefront:
    build: .
    container_name: ecom-storefront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_MODE=storefront
      - ECOM_PORT=3000
      - DB_CONNECTION_STRING=postgres://app_user:SecurePass2025@10.10.2.3:5432/enterprise_ecom

  ecom-admin:
    build: .
    container_name: ecom-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_MODE=admin
      - ADMIN_PORT=3000
      - DB_CONNECTION_STRING=postgres://app_user:SecurePass2025@10.10.2.3:5432/enterprise_ecom
