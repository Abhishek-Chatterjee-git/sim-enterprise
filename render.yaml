# Render Blueprint Deployment Configuration
# Pure Enterprise E-Commerce Platform
# Deploys:
# 1. PostgreSQL Database (enterprise_db)
# 2. Storefront Web Service (ARTISAN LUXE E-Commerce Store & Customer Privacy Settings)

databases:
  - name: enterprise-postgres
    databaseName: enterprise_db
    user: app_user
    plan: free
    region: singapore # Closest to India region on Render

services:
  # ---------------------------------------------------------------------------
  # 1. Enterprise E-Commerce Storefront & Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: sim-enterprise-storefront
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-postgres
          property: connectionString
      - key: DB_TYPE
        value: POSTGRES
      - key: CONTROL_PLANE_URL
        value: https://api.yourcompliance.com # Public URL of your deployed SaaS Compliance Control Plane
      - key: ORGANIZATION_SLUG
        value: artisan-luxe-enterprise
      - key: SESSION_SECRET
        generateValue: true
